<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boriyde</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<style>
:root{--bg:#f3effc;--sf:#fff;--sf2:#e7ddfb;--tx:#13101d;--mu:#6b6089;--ac:#6a3df0;--gr:#12a05a;--bd:#d8cdf3;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09080e;--sf:#181229;--sf2:#2a1d4e;--tx:#f0ecfa;--mu:#a398c8;--ac:#8a5cff;--gr:#3ddc84;--bd:#33275c;--on:#09080e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09080e;--sf:#181229;--sf2:#2a1d4e;--tx:#f0ecfa;--mu:#a398c8;--ac:#8a5cff;--gr:#3ddc84;--bd:#33275c;--on:#09080e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'PT Serif',Georgia,serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.burger{width:42px;height:42px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;padding-left:12px;cursor:pointer}
.burger i{display:block;height:2px;width:16px;background:var(--tx);border-radius:2px;transition:width .2s}
.burger:hover i:nth-child(2){width:11px}
.logo{font-weight:700;font-size:22px;letter-spacing:.5px;flex:1}.logo b{color:var(--gr)}
.ico{width:42px;height:42px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;cursor:pointer;font-size:18px}
select{background:var(--sf);border:1px solid var(--bd);border-radius:12px;height:42px;padding:0 8px;color:var(--tx);font:inherit}
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
nav{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:80vw;background:var(--sf);border-right:1px solid var(--bd);z-index:50;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:calc(24px + env(safe-area-inset-top,0px)) 14px 20px}
nav.on{transform:none}
nav h3{margin:0 8px 18px;font-size:20px}
nav button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:13px 12px;border-radius:12px;font-size:17px;cursor:pointer;margin-bottom:4px}
nav button.act{background:var(--ac);color:#fff}
nav button:not(.act):hover{background:var(--sf2)}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
h2{font-size:26px;margin:6px 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}
.amt{width:100%;font-size:40px;font-weight:700;border:0;border-bottom:2px solid var(--bd);background:none;padding:6px 0;outline:none;transition:border-color .2s}
.amt:focus{border-color:var(--gr)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:16px;transition:transform .15s,border-color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--ac)}
.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.inp{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:12px;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--ac)}
.btn{border:0;background:var(--gr);color:var(--on);font-weight:700;border-radius:14px;padding:14px 20px;cursor:pointer;width:100%;font-size:17px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--sf2);color:var(--tx)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .g{flex:1;min-width:0}.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:18px}
.x.arm{color:#ff5470}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700}
.big{font-size:34px;font-weight:700}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer}
.seg .on{background:var(--ac);color:#fff}
.bar{height:10px;border-radius:6px;background:var(--sf2);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:6px;width:0}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--mu)}
.day{aspect-ratio:1/1.05;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;overflow:hidden;min-width:0}
.day small{font-size:10px;color:var(--gr);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.today{border-color:var(--gr)}.day.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.day.sel small{color:#fff}
.day.e{visibility:hidden}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc button{height:62px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);font-size:22px;cursor:pointer;transition:transform .1s}
.calc button:active{transform:scale(.94)}
.calc .o{background:var(--sf2)}.calc .eq{background:var(--gr);color:var(--on);font-weight:700}
.disp{text-align:right;padding:10px 4px 16px;min-height:90px;word-break:break-all}
.disp .big{font-size:42px}
.sk{height:70px;border-radius:16px;margin-bottom:14px;background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gr);color:var(--on);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;opacity:0;pointer-events:none}
.hid{display:none}
.mh{font-size:15px;color:var(--mu);margin:18px 0 8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <button class="burger" id="bg" aria-label="Меню"><i></i><i></i><i></i></button>
  <div class="logo">Bori<b>y</b>de</div>
  <select id="cur" aria-label="Валюта"><option>сум</option><option>$</option><option>₽</option><option>€</option></select>
  <button class="ico" id="th" aria-label="Тема">◐</button>
</header>
<div class="scrim" id="sc"></div>
<nav id="nv"><h3>Boriyde</h3></nav>
<main id="app"></main>
<div class="toast" id="ts"></div>
<script>
const CATS=[['Дорога','#8a5cff'],['Еда','#3ddc84'],['Развлечение','#c06cff'],['Инвестиция','#22b8a0'],['Одежда','#6f7bff'],['Покупка','#a3e635'],['Подписки','#9b6bd6'],['Долг','#ff7a90'],['Зависимости','#f0a04b']];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const VIEWS=[['add','＋','Новая запись'],['hist','☰','Записи'],['stat','▥','Статистика'],['cal','▦','Календарь'],['calc','＝','Калькулятор']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=window.Motion;
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let E=ld('bor_e',[]),CUR=ld('bor_c','сум'),view='add';
const now=new Date();
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ds(now);
let cal={y:now.getFullYear(),m:now.getMonth(),sel:today},st={p:'m',y:now.getFullYear(),m:now.getMonth()};
function toC(s){s=String(s).replace(/\s/g,'').replace(',','.');if(!/^\d+(\.\d{0,2})?$/.test(s))return null;const[i,f='']=s.split('.');return +i*100+ +(f+'00').slice(0,2)}
function fm(c){return (c/100).toLocaleString('ru-RU',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2})+' '+CUR}
const sum=a=>a.reduce((t,e)=>t+e.c,0);
const col=n=>CATS.find(c=>c[0]===n)[1];
function dl(s){const[y,m,d]=s.split('-');return +d+' '+MN[m-1].toLowerCase().replace(/[ьй]$/,'я').replace('т','та').replace('та','та')+' '+y}
function dlabel(s){if(s===today)return 'Сегодня';const y=new Date(now);y.setDate(y.getDate()-1);if(s===ds(y))return 'Вчера';const[Y,m,d]=s.split('-');const g=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return +d+' '+g[m-1]+' '+Y}
function save(){sv('bor_e',E)}
function toast(t){const el=$('#ts');el.textContent=t;if(M)M.animate(el,{opacity:[0,1,1,0],y:[20,0,0,-10]},{duration:1.8});else{el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1500)}}
function enter(sel){if(!M)return;try{M.animate([...document.querySelectorAll(sel)],{opacity:[0,1],transform:['translateY(14px)','translateY(0)']},{duration:.45,delay:M.stagger(.06)})}catch(e){}}
function rows(a){return a.map(e=>`<div class="row"><span class="dot" style="background:${col(e.cat)}"></span><div class="g"><div>${e.cat}</div><div class="mu n">${e.note?esc(e.note):'без описания'}</div></div><b>${fm(e.c)}</b><button class="x" data-del="${e.id}" title="Удалить">✕</button></div>`).join('')}
function bindDel(fn){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='?';setTimeout(()=>{b.classList.remove('arm');b.textContent='✕'},2500);return}E=E.filter(e=>e.id!=b.dataset.del);save();fn()})}
/* views */
const V={};
V.add=()=>{
  const t=sum(E.filter(e=>e.d===today));
  $('#app').innerHTML=`<h2>Новая запись</h2>
  <div class="card c1"><div class="mu">Сегодня потрачено: <b>${fm(t)}</b></div>
  <input class="amt" id="am" inputmode="decimal" placeholder="0" autocomplete="off">
  <div class="mu" id="er"></div></div>
  <div class="card hid" id="st2"><div class="mu">На что потратили?</div><div class="chips">${CATS.map(c=>`<button class="chip" data-c="${c[0]}"><span class="dot" style="background:${c[1]}"></span>${c[0]}</button>`).join('')}</div>
  <input class="inp" id="nt" maxlength="120" placeholder="Зачем? (можно пропустить)">
  <input class="inp" id="dt" type="date" value="${today}" max="9999-12-31">
  <button class="btn" id="sv" disabled style="opacity:.5">Сохранить</button></div>`;
  let cat=null,shown=false;const am=$('#am');
  const chk=()=>{const v=am.value.trim(),c=toC(v);$('#er').textContent=v&&(c===null||c<=0)?'Введите сумму, например 12500 или 49,90':'';
    const ok=c>0;const box=$('#st2');
    if(ok&&!shown){shown=true;box.classList.remove('hid');if(M)M.animate(box,{opacity:[0,1],transform:['translateY(16px)','none']},{duration:.4});}
    if(!ok&&shown){shown=false;box.classList.add('hid')}
    $('#sv').disabled=!(ok&&cat);$('#sv').style.opacity=ok&&cat?1:.5};
  am.oninput=chk;am.focus();
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b));if(M)M.animate(b,{scale:[.94,1]},{duration:.25});chk();$('#nt').focus()});
  const go=()=>{const c=toC(am.value);if(!(c>0&&cat))return;E.push({id:Date.now()+Math.random().toString(36).slice(2,6),c,cat,note:$('#nt').value.trim(),d:$('#dt').value||today});save();toast('Сохранено ✓');V.add()};
  $('#sv').onclick=go;$('#nt').onkeydown=e=>{if(e.key==='Enter')go()};
  enter('.card');
};
V.hist=()=>{
  const s=[...E].sort((a,b)=>b.d.localeCompare(a.d)||String(b.id).localeCompare(String(a.id)));
  let h='<h2>Записи</h2>';
  if(!s.length)h+='<div class="card mu">Пока пусто. Добавьте первую запись.</div>';
  const ys={};s.forEach(e=>{const y=e.d.slice(0,4),m=e.d.slice(5,7);((ys[y]??={})[m]??=[]).push(e)});
  Object.keys(ys).sort().reverse().forEach(y=>{
    const all=Object.values(ys[y]).flat();
    h+=`<div class="mh card" style="margin:14px 0 8px;font-size:20px;color:var(--tx)"><b>${y}</b><b>${fm(sum(all))}</b></div>`;
    Object.keys(ys[y]).sort().reverse().forEach(m=>{const a=ys[y][m];
      h+=`<div class="mh"><span>${MN[+m-1]}</span><span>${fm(sum(a))}</span></div><div class="card">`;
      let last='';a.forEach(e=>{if(e.d!==last){last=e.d;h+=`<div class="mu" style="padding-top:8px">${dlabel(e.d)}</div>`}h+=rows([e])});
      h+='</div>'});
  });
  $('#app').innerHTML=h;bindDel(V.hist);enter('.card');
};
V.stat=()=>{
  const{p,y,m}=st;
  const f=e=>p==='a'||(e.d.startsWith(y+'-')&&(p==='y'||e.d.slice(5,7)===pad(m+1)));
  const a=E.filter(f),t=sum(a);
  const by=CATS.map(c=>[c[0],c[1],sum(a.filter(e=>e.cat===c[0])),a.filter(e=>e.cat===c[0]).length]).filter(r=>r[2]>0).sort((x,z)=>z[2]-x[2]);
  const days=new Set(a.map(e=>e.d)).size;
  const lbl=p==='m'?MN[m]+' '+y:p==='y'?y:'За всё время';
  $('#app').innerHTML=`<h2>Статистика</h2>
  <div class="seg">${[['m','Месяц'],['y','Год'],['a','Всё']].map(x=>`<button data-p="${x[0]}" class="${p===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
  ${p!=='a'?`<div class="nav2"><button class="ico" id="pv">‹</button><b>${lbl}</b><button class="ico" id="nx">›</button></div>`:''}
  <div class="card"><div class="mu">Всего потрачено</div><div class="big">${fm(t)}</div>
  <div class="mu">${a.length} записей · ${days?'в среднем '+fm(Math.round(t/days))+' в день с тратами':'нет данных'}</div></div>
  <div class="card">${by.length?by.map(r=>`<div class="tot" style="font-size:16px"><span><span class="dot" style="background:${r[1]};display:inline-block"></span> ${r[0]} <span class="mu">· ${r[3]}</span></span><span>${fm(r[2])} <span class="mu">${(r[2]/t*100).toFixed(1).replace('.',',')}%</span></span></div><div class="bar"><i data-w="${r[2]/t*100}" style="background:${r[1]}"></i></div>`).join(''):'<div class="mu">За этот период трат нет.</div>'}</div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.p=b.dataset.p;V.stat()});
  const step=d=>{if(p==='y')st.y+=d;else{st.m+=d;if(st.m<0){st.m=11;st.y--}if(st.m>11){st.m=0;st.y++}}V.stat()};
  if($('#pv')){$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1)}
  document.querySelectorAll('.bar i').forEach(i=>{const w=i.dataset.w+'%';if(M)M.animate(i,{width:['0%',w]},{duration:.8,ease:'easeOut'});else i.style.width=w;i.style.width=w});
  enter('.card');
};
V.cal=()=>{
  const{y,m}=cal,first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  const tot={};E.forEach(e=>tot[e.d]=(tot[e.d]||0)+e.c);
  const short=c=>{const v=c/100;return v>=1e6?(v/1e6).toFixed(1).replace('.',',')+'M':v>=1e4?Math.round(v/1e3)+'k':Math.round(v)};
  let g=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="wd">${d}</div>`).join('')+'<div class="day e"></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);g+=`<button class="day ${k===today?'today':''} ${k===cal.sel?'sel':''}" data-d="${k}"><span>${d}</span><small>${tot[k]?short(tot[k]):''}</small></button>`}
  const mt=sum(E.filter(e=>e.d.startsWith(y+'-'+pad(m+1))));
  $('#app').innerHTML=`<h2>Календарь</h2><div class="card"><div class="nav2"><button class="ico" id="pv">‹</button><b>${MN[m]} ${y}</b><button class="ico" id="nx">›</button></div><div class="grid">${g}</div><div class="mu" style="margin-top:12px">Всего за месяц: <b>${fm(mt)}</b></div></div><div id="dd"></div>`;
  const show=()=>{const a=E.filter(e=>e.d===cal.sel);
    $('#dd').innerHTML=`<div class="card"><div class="tot"><span>${dlabel(cal.sel)}</span><span>Всего: ${fm(sum(a))}</span></div>${a.length?rows(a):'<div class="mu" style="margin-top:10px">В этот день трат не было.</div>'}</div>`;
    bindDel(()=>V.cal());if(M)M.animate('#dd .card',{opacity:[0,1],transform:['translateY(10px)','none']},{duration:.3})};
  document.querySelectorAll('.day[data-d]').forEach(b=>b.onclick=()=>{cal.sel=b.dataset.d;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('sel',x===b));show()});
  const mv=d=>{cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}V.cal()};
  $('#pv').onclick=()=>mv(-1);$('#nx').onclick=()=>mv(1);show();enter('.card');
};
/* calculator: exact decimal arithmetic via BigInt */
const S=10n**12n;
const pB=s=>{const ng=s[0]==='-';if(ng)s=s.slice(1);const[i,f='']=s.split('.');const v=BigInt(i||'0')*S+BigInt((f+'000000000000').slice(0,12));return ng?-v:v};
const fB=v=>{const ng=v<0n;if(ng)v=-v;const f=(v%S).toString().padStart(12,'0').replace(/0+$/,'');return(ng?'-':'')+(v/S)+(f?'.'+f:'')};
let C={cur:'0',prev:null,op:null,fresh:true,err:false};
function calcOp(a,o,b){if(o==='+')return a+b;if(o==='−')return a-b;if(o==='×')return a*b/S;if(b===0n)throw 0;return a*S/b}
function ck(k){
  if(C.err){C={cur:'0',prev:null,op:null,fresh:true,err:false}}
  if(/\d/.test(k)){if(C.fresh){C.cur=k;C.fresh=false}else if(C.cur.replace(/[-.]/g,'').length<18)C.cur=C.cur==='0'?k:C.cur+k}
  else if(k==='.'){if(C.fresh){C.cur='0.';C.fresh=false}else if(!C.cur.includes('.'))C.cur+='.'}
  else if(k==='C')C={cur:'0',prev:null,op:null,fresh:true,err:false};
  else if(k==='⌫'){if(!C.fresh)C.cur=C.cur.length>1?C.cur.slice(0,-1):'0'}
  else{try{
    if(C.op&&!C.fresh){C.cur=fB(calcOp(C.prev,C.op,pB(C.cur)));}
    if(k==='='){C.prev=null;C.op=null;C.fresh=true}
    else{C.prev=pB(C.cur);C.op=k;C.fresh=true}
  }catch(e){C={cur:'Деление на ноль',prev:null,op:null,fresh:true,err:true}}}
  const d=$('#cd');if(d){d.textContent=C.err?C.cur:C.cur.replace(/\B(?=(\d{3})+(?!\d))(?<![.\d]\d*\.\d*)/g,' ');$('#ce').textContent=C.op?fB(C.prev)+' '+C.op:'\u00a0'}
}
V.calc=()=>{
  const keys=['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','=','0','.'];
  $('#app').innerHTML=`<h2>Калькулятор</h2><div class="card"><div class="disp"><div class="mu" id="ce">&nbsp;</div><div class="big" id="cd">0</div></div><div class="calc">${keys.map(k=>`<button data-k="${k}" class="${'÷×−+⌫C'.includes(k)?'o':''} ${k==='='?'eq':''}" style="${k==='0'?'grid-column:span 2':k==='='?'grid-row:span 2;height:auto':''}">${k}</button>`).join('')}</div><button class="btn sec" id="tr" style="margin-top:12px">Перенести сумму в запись</button></div><div class="mu">Расчёты точные: без ошибок округления вроде 0,1 + 0,2.</div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>ck(b.dataset.k));
  $('#tr').onclick=()=>{if(C.err)return;ck('=');const c=toC(C.cur);if(!(c>0)){toast('Нужна положительная сумма');return}window._pre=C.cur;go('add');setTimeout(()=>{const a=$('#am');if(a){a.value=window._pre;a.dispatchEvent(new Event('input'))}},50)};
  C.fresh=true;ck('');enter('.card');
};
document.addEventListener('keydown',e=>{if(view!=='calc')return;const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫',',':'.','Escape':'C'};const k=m[e.key]||(/^[\d.]$/.test(e.key)?e.key:null);if(k){e.preventDefault();ck(k)}});
/* shell */
const nv=$('#nv'),sc=$('#sc');
nv.insertAdjacentHTML('beforeend',VIEWS.map(v=>`<button data-v="${v[0]}"><span>${v[1]}</span>${v[2]}</button>`).join(''));
function menu(o){nv.classList.toggle('on',o);sc.classList.toggle('on',o);if(o&&M)M.animate('nav button',{opacity:[0,1],x:[-16,0]},{duration:.35,delay:M.stagger(.05)})}
function go(v){view=v;menu(false);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('act',b.dataset.v===v));
  const a=$('#app');a.innerHTML='<div class="sk"></div><div class="sk"></div>';
  setTimeout(()=>{V[v]();window.scrollTo(0,0)},180)}
$('#bg').onclick=()=>menu(true);sc.onclick=()=>menu(false);
nv.onclick=e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)};
$('#cur').value=CUR;$('#cur').onchange=e=>{CUR=e.target.value;sv('bor_c',CUR);V[view]()};
const root=document.documentElement;const t0=ld('bor_t',null);if(t0)root.dataset.theme=t0;
$('#th').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const n=dark?'light':'dark';root.dataset.theme=n;sv('bor_t',n)};
$('#app').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
setTimeout(()=>go('add'),450);
</script>
